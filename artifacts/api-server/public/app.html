<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGO 긴급 알림</title>
  <link rel="manifest" href="/api/static/manifest.json" />
  <meta name="theme-color" content="#ff4444" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="긴급알림" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #ff4444;
      --accent2: #ff6b6b;
      --warning: #ffa500;
      --success: #00d4aa;
      --text: #e8e8f0;
      --text2: #9999bb;
      --border: #2a2a4a;
      --radius: 12px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .status-bar {
      background: var(--surface2);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .status-bar .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-indicator .icon { font-size: 14px; }
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }

    /* Setup Section */
    #setup-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    #setup-section h2 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
    #setup-section .desc { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .form-group select option { background: var(--bg); }
    #user-search-input { width: 100%; }
    #user-list {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 6px;
      display: none;
    }
    .user-item {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .user-item:last-child { border-bottom: none; }
    .user-item:hover, .user-item.selected { background: var(--surface2); color: var(--accent); }
    #selected-user-display {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--success);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--success);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent2); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-success { background: var(--success); color: #000; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Emergency Card */
    .emergency-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--accent);
      margin-bottom: 16px;
      overflow: hidden;
      animation: emergencyPulse 2s ease-in-out infinite;
    }
    @keyframes emergencyPulse {
      0%, 100% { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(255,68,68,0); }
      50% { border-color: var(--accent2); box-shadow: 0 0 20px 4px rgba(255,68,68,0.3); }
    }
    .emergency-card.acknowledged {
      border-color: var(--success);
      animation: none;
    }
    .emergency-card.responded {
      border-color: var(--text2);
      animation: none;
      opacity: 0.7;
    }
    .emergency-header {
      background: var(--accent);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .emergency-card.acknowledged .emergency-header { background: var(--success); }
    .emergency-card.responded .emergency-header { background: var(--text2); }
    .emergency-header .badge {
      font-size: 20px;
    }
    .emergency-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      flex: 1;
    }
    .emergency-header .time {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
    }
    .emergency-body { padding: 16px; }
    .shot-info {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .shot-info .shot-code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }
    .shot-info .project-name {
      font-size: 13px;
      color: var(--text2);
      display: flex;
      align-items: center;
    }
    .response-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .response-btn {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .response-btn:active { transform: scale(0.97); }
    .response-btn.r10 { background: #00d4aa; color: #000; }
    .response-btn.r30 { background: #ffa500; color: #000; }
    .response-btn.rno { background: #ff4444; color: #fff; }
    .response-btn .icon { font-size: 20px; }
    .response-btn .label { flex: 1; text-align: left; }
    .confirm-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: confirmPulse 1s ease-in-out infinite;
    }
    @keyframes confirmPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-tag.pending { background: rgba(255,68,68,0.2); color: var(--accent); }
    .status-tag.acknowledged { background: rgba(0,212,170,0.2); color: var(--success); }
    .status-tag.responded { background: rgba(153,153,187,0.2); color: var(--text2); }
    .status-tag.unacknowledged { background: rgba(255,165,0,0.2); color: var(--warning); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 999;
      transition: transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Audio alert */
    #audio-alert { display: none; }

    .section-title {
      font-size: 13px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 0 10px;
      font-weight: 600;
    }

    .push-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .push-status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .push-status .dot.green { background: var(--success); }
    .push-status .dot.red { background: var(--accent); }
    .push-status .dot.yellow { background: var(--warning); }
    #push-retry-banner {
      display: none;
      background: #2a1a1a;
      border-bottom: 1px solid var(--accent);
      padding: 12px 20px;
      font-size: 13px;
      color: var(--accent);
      align-items: center;
      gap: 10px;
    }
    #push-retry-banner button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .reminder-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="dot" id="header-dot"></div>
    <h1>MAGO 긴급 알림</h1>
    <div style="flex:1"></div>
    <div class="push-status" id="push-status">
      <div class="dot yellow" id="push-dot"></div>
      <span id="push-label">초기화 중...</span>
    </div>
  </header>

  <div id="push-retry-banner">
    <span style="flex:1">⚠️ 알림 권한이 필요합니다</span>
    <button onclick="retryPush()">알림 허용하기</button>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <span class="icon">👤</span>
      <span id="user-display">로그인 필요</span>
    </div>
    <div class="status-indicator">
      <span class="icon">🔔</span>
      <span id="active-count">활성 긴급 0건</span>
    </div>
  </div>

  <main>
    <!-- Setup Section -->
    <div id="setup-section">
      <h2>🔐 본인 확인</h2>
      <p class="desc">이름을 검색해서 선택해주세요.</p>

      <div id="selected-user-display">
        <span>✅</span>
        <span id="selected-user-name"></span>
        <button onclick="clearSelectedUser()" style="margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;">변경</button>
      </div>

      <div class="form-group" id="search-group">
        <input type="text" id="user-search-input" placeholder="이름 검색..." autocomplete="off" oninput="filterUsers()" onfocus="showUserList()" />
        <div id="user-list"></div>
      </div>

      <button class="btn btn-primary btn-full" id="setup-btn" onclick="setupUser()" disabled>
        🔔 알림 활성화
      </button>
      <div style="margin-top:10px; font-size:12px; color:var(--text2)">
        * 처음 한 번만 설정하면 이후 자동으로 알림이 수신됩니다.
      </div>
    </div>

    <!-- Active Emergencies -->
    <div id="emergency-section" style="display:none">
      <div class="section-title">활성 긴급 알림</div>
      <div id="emergency-list"></div>
      <div id="empty-state" class="empty-state" style="display:none">
        <div class="icon">✅</div>
        <h3>현재 긴급 상황 없음</h3>
        <p>긴급 수정 요청이 발생하면 즉시 알림이 울립니다.</p>
      </div>
    </div>

    <!-- Recent History -->
    <div id="history-section" style="display:none">
      <div class="section-title">최근 처리 내역</div>
      <div id="history-list"></div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const API_BASE = "/api";
    let currentUserId = null;
    let currentUserName = null;
    let swRegistration = null;
    let pollInterval = null;
    let focusedEmergencyId = null;
    let allUsers = [];
    let selectedUserId = null;
    let selectedUserName = null;

    // Load ShotGrid user list
    async function loadUserList() {
      try {
        const res = await fetch(`${API_BASE}/users`);
        const { data } = await res.json();
        allUsers = data || [];
      } catch (e) {
        console.error("Failed to load users", e);
      }
    }

    function filterUsers() {
      const query = document.getElementById("user-search-input").value.trim().toLowerCase();
      showUserList(query);
    }

    function showUserList(query = "") {
      const list = document.getElementById("user-list");
      const filtered = query
        ? allUsers.filter(u => u.name.toLowerCase().includes(query))
        : allUsers;

      if (filtered.length === 0) {
        list.innerHTML = '<div class="user-item" style="color:var(--text2)">검색 결과 없음</div>';
      } else {
        list.innerHTML = filtered.map(u =>
          `<div class="user-item" onclick="selectUser(${u.id}, '${u.name.replace(/'/g,"\\'")}')">
            ${u.name}
          </div>`
        ).join("");
      }
      list.style.display = "block";
    }

    function selectUser(id, name) {
      selectedUserId = id;
      selectedUserName = name;
      document.getElementById("user-list").style.display = "none";
      document.getElementById("search-group").style.display = "none";
      document.getElementById("selected-user-name").textContent = name;
      document.getElementById("selected-user-display").style.display = "flex";
      document.getElementById("setup-btn").disabled = false;
    }

    function clearSelectedUser() {
      selectedUserId = null;
      selectedUserName = null;
      document.getElementById("search-group").style.display = "block";
      document.getElementById("selected-user-display").style.display = "none";
      document.getElementById("user-search-input").value = "";
      document.getElementById("user-list").style.display = "none";
      document.getElementById("setup-btn").disabled = true;
    }

    // Hide user list on outside click
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#search-group")) {
        document.getElementById("user-list").style.display = "none";
      }
    });

    // Load saved user
    function loadSavedUser() {
      const savedId = localStorage.getItem("mago_user_id");
      const savedName = localStorage.getItem("mago_user_name");
      if (savedId && savedName) {
        currentUserId = parseInt(savedId);
        currentUserName = savedName;
        document.getElementById("user-display").textContent = savedName;
        document.getElementById("setup-section").style.display = "none";
        document.getElementById("emergency-section").style.display = "block";
        document.getElementById("history-section").style.display = "block";
        return true;
      }
      return false;
    }

    // Check URL param for focused emergency
    function checkUrlParam() {
      const params = new URLSearchParams(window.location.search);
      const emergencyId = params.get("emergency");
      if (emergencyId) focusedEmergencyId = emergencyId;
    }

    // Setup user and subscribe to push
    async function setupUser() {
      if (!selectedUserId || !selectedUserName) {
        showToast("⚠️ 이름을 선택해주세요.");
        return;
      }

      currentUserId = selectedUserId;
      currentUserName = selectedUserName;
      localStorage.setItem("mago_user_id", selectedUserId.toString());
      localStorage.setItem("mago_user_name", selectedUserName);

      document.getElementById("user-display").textContent = selectedUserName;
      document.getElementById("setup-btn").disabled = true;
      document.getElementById("setup-btn").textContent = "설정 중...";

      await initPush();

      document.getElementById("setup-section").style.display = "none";
      document.getElementById("emergency-section").style.display = "block";
      document.getElementById("history-section").style.display = "block";

      showToast("✅ 설정 완료! 긴급 알림이 활성화되었습니다.");
      startPolling();
    }

    // Initialize push notifications
    async function initPush() {
      if (!("serviceWorker" in navigator)) {
        updatePushStatus("red", "푸시 미지원 브라우저");
        return;
      }
      if (!("PushManager" in window)) {
        updatePushStatus("red", "푸시 미지원");
        return;
      }

      try {
        updatePushStatus("yellow", "등록 중...");
        swRegistration = await navigator.serviceWorker.register("/api/static/sw.js", {
          scope: "/api/",
        });

        await navigator.serviceWorker.ready;

        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          updatePushStatus("red", "알림 권한 거부됨");
          showToast("⚠️ 알림 권한을 허용해야 긴급 알림을 받을 수 있습니다.");
          return;
        }

        // Get VAPID key
        const keyRes = await fetch(`${API_BASE}/vapid-public-key`);
        const { key } = await keyRes.json();

        if (!key) {
          updatePushStatus("yellow", "서버 설정 필요");
          showToast("⚠️ VAPID 키가 설정되지 않았습니다. 서버 환경변수를 확인해주세요.");
          return;
        }

        const subscription = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(key),
        });

        await fetch(`${API_BASE}/subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId, subscription }),
        });

        updatePushStatus("green", "알림 활성");
        document.getElementById("push-retry-banner").style.display = "none";

        // Listen for SW messages
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data?.type === "EMERGENCY_CLICK") {
            focusedEmergencyId = event.data.emergencyId;
            loadEmergencies();
            playAlert();
          }
        });

      } catch (err) {
        console.error("Push init error:", err);
        updatePushStatus("red", "초기화 실패");
        if (currentUserId) {
          document.getElementById("push-retry-banner").style.display = "flex";
        }
      }
    }

    async function retryPush() {
      document.getElementById("push-retry-banner").style.display = "none";
      updatePushStatus("yellow", "재시도 중...");
      await initPush();
    }

    function updatePushStatus(color, label) {
      document.getElementById("push-dot").className = `dot ${color}`;
      document.getElementById("push-label").textContent = label;
    }

    // Polling for emergencies
    function startPolling() {
      loadEmergencies();
      pollInterval = setInterval(loadEmergencies, 10000);
    }

    async function loadEmergencies() {
      try {
        const res = await fetch(`${API_BASE}/emergency`);
        const { data } = await res.json();

        const active = data.filter(e => e.status === "pending" || e.status === "acknowledged");
        const history = data.filter(e => e.status === "responded" || e.status === "unacknowledged");

        document.getElementById("active-count").textContent = `활성 긴급 ${active.length}건`;

        renderEmergencies(active);
        renderHistory(history.slice(0, 10));

        // If focused emergency, scroll to it
        if (focusedEmergencyId) {
          const el = document.getElementById(`card-${focusedEmergencyId}`);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }
      } catch (err) {
        console.error("Load emergencies error:", err);
      }
    }

    function renderEmergencies(emergencies) {
      const list = document.getElementById("emergency-list");
      const empty = document.getElementById("empty-state");

      if (emergencies.length === 0) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      list.innerHTML = emergencies.map(e => createEmergencyCard(e)).join("");
    }

    function renderHistory(history) {
      const list = document.getElementById("history-list");
      if (history.length === 0) {
        list.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:8px 0">처리 내역 없음</div>';
        return;
      }
      list.innerHTML = history.map(e => createHistoryItem(e)).join("");
    }

    function createEmergencyCard(e) {
      const elapsed = formatElapsed(e.createdAt);
      const isFocused = e.id === focusedEmergencyId;
      const statusClass = e.status;

      const acknowledgedHtml = e.status === "pending"
        ? `<button class="confirm-btn" onclick="acknowledge('${e.id}')">
            🔔 확인 (알림 중지)
           </button>`
        : `<div style="margin-bottom:12px; color:var(--success); font-size:13px; display:flex;align-items:center;gap:6px;">
            ✅ 확인됨 · ${formatTime(e.acknowledgedAt)}
           </div>`;

      const responseHtml = e.status === "acknowledged"
        ? `<div class="response-buttons">
            <button class="response-btn r10" onclick="respond('${e.id}', 'remote_within_10')">
              <span class="icon">⚡</span>
              <span class="label">10분 이내 원격 접속 가능</span>
            </button>
            <button class="response-btn r30" onclick="respond('${e.id}', 'remote_within_30')">
              <span class="icon">🕐</span>
              <span class="label">30분 이내 원격 접속 가능</span>
            </button>
            <button class="response-btn rno" onclick="respond('${e.id}', 'remote_unavailable')">
              <span class="icon">❌</span>
              <span class="label">30분 이내 원격 접속 불가</span>
            </button>
           </div>`
        : "";

      const reminderBadge = e.reminderCount > 0
        ? `<span class="reminder-badge">${e.reminderCount}회 재전송</span>`
        : "";

      return `
        <div class="emergency-card ${statusClass}" id="card-${e.id}" style="${isFocused ? 'outline:3px solid var(--warning);' : ''}">
          <div class="emergency-header">
            <span class="badge">🚨</span>
            <h3>긴급 수정 요청 ${reminderBadge}</h3>
            <span class="time">${elapsed}</span>
          </div>
          <div class="emergency-body">
            <div class="shot-info">
              <div class="shot-code">${e.shotCode}</div>
              <div class="project-name">${e.projectName}</div>
            </div>
            ${acknowledgedHtml}
            ${responseHtml}
          </div>
        </div>`;
    }

    function createHistoryItem(e) {
      const statusLabels = {
        responded: { icon: "✅", label: "처리 완료", cls: "responded" },
        unacknowledged: { icon: "⚠️", label: "미확인 처리", cls: "unacknowledged" },
      };
      const responseLabels = {
        remote_within_10: "10분 이내 원격 접속",
        remote_within_30: "30분 이내 원격 접속",
        remote_unavailable: "30분 이내 접속 불가",
      };
      const s = statusLabels[e.status] || { icon: "•", label: e.status, cls: "" };
      const rLabel = e.responseType ? ` · ${responseLabels[e.responseType] || e.responseType}` : "";

      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:8px;margin-bottom:8px;border:1px solid var(--border);">
          <span style="font-size:18px">${s.icon}</span>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600;">${e.shotCode} <span style="color:var(--text2);font-size:12px">${e.projectName}</span></div>
            <div style="font-size:12px;color:var(--text2)">${s.label}${rLabel} · ${formatTime(e.respondedAt || e.createdAt)}</div>
          </div>
          <span class="status-tag ${s.cls}">${s.icon} ${s.label}</span>
        </div>`;
    }

    async function acknowledge(emergencyId) {
      try {
        await fetch(`${API_BASE}/emergency/${emergencyId}/acknowledge`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId }),
        });
        showToast("✅ 확인 완료! 실장/PM에게 전달되었습니다.");
        focusedEmergencyId = emergencyId;
        loadEmergencies();
      } catch (err) {
        showToast("❌ 오류가 발생했습니다.");
      }
    }

    async function respond(emergencyId, responseType) {
      try {
        const res = await fetch(`${API_BASE}/emergency/${emergencyId}/respond`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId, responseType }),
        });
        const data = await res.json();
        showToast(`📋 응답 전달 완료: ${data.label}`);
        focusedEmergencyId = null;
        loadEmergencies();
      } catch (err) {
        showToast("❌ 오류가 발생했습니다.");
      }
    }

    function playAlert() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = (freq, start, duration, vol = 0.8) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
          gain.gain.setValueAtTime(0, ctx.currentTime + start);
          gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + duration + 0.05);
        };
        playBeep(880, 0,    0.15);
        playBeep(660, 0.2,  0.15);
        playBeep(880, 0.4,  0.15);
        playBeep(1100, 0.6, 0.25);
        playBeep(880, 1.0,  0.15);
        playBeep(660, 1.2,  0.15);
        playBeep(880, 1.4,  0.15);
        playBeep(1100, 1.6, 0.35);
      } catch (e) {
        console.warn("Audio not available:", e);
      }
    }

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), duration);
    }

    function formatElapsed(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return `${diff}초 전`;
      if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
      return `${Math.floor(diff/3600)}시간 전`;
    }

    function formatTime(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
    }

    // Init
    checkUrlParam();
    const hasUser = loadSavedUser();
    if (hasUser) {
      initPush().then(() => startPolling());
    } else {
      loadUserList();
    }

    // Visibility change - refresh when app comes to foreground
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && hasUser) {
        loadEmergencies();
      }
    });
  </script>
</body>
</html>
