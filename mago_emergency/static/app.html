<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGO 긴급 알림</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#c4cede" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="긴급알림" />
  <link
    rel="stylesheet"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Calm gray (slightly darker than before; not OLED black) */
      --bg: #aeb8ca;
      --surface: #e8ecf4;
      --surface2: #dce2ee;
      --accent: #d93440;
      --accent2: #e85c66;
      --warning: #c9a227; /* 30분 가능 */
      --success: #1fa87a; /* 10분 가능 */
      --danger: #d63d5c;  /* 불가 */
      --text: #1a2233;
      --text2: #5a657a;
      --border: rgba(26, 34, 51, 0.10);
      --radius: 12px;
    }
    body {
      background:
        linear-gradient(165deg, #c5cede 0%, #b4bed2 42%, #a8b3c9 100%),
        radial-gradient(900px 480px at 85% -5%, rgba(217, 52, 64, 0.10), transparent 55%),
        radial-gradient(700px 400px at 5% 100%, rgba(31, 168, 122, 0.08), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family:
        "Pretendard",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        system-ui,
        sans-serif;
      font-feature-settings: "kern" 1;
      letter-spacing: -0.01em;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(232, 236, 244, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
    header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .status-bar {
      background: rgba(232, 236, 244, 0.92);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .status-indicator { display: flex; align-items: center; gap: 6px; }
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }

    /* Setup Section */
    #setup-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    #setup-section h2 { font-size: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Emergency Card */
    .emergency-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--accent);
      margin-bottom: 16px;
      overflow: hidden;
      animation: emergencyPulse 2s ease-in-out infinite;
    }
    @keyframes emergencyPulse {
      0%, 100% { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(255,68,68,0); }
      50% { border-color: var(--accent2); box-shadow: 0 0 20px 4px rgba(255,68,68,0.3); }
    }
    .emergency-card.acknowledged { border-color: var(--success); animation: none; }
    .emergency-card.responded { border-color: var(--text2); animation: none; opacity: 0.7; }
    .emergency-header {
      background: var(--accent);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .emergency-card.acknowledged .emergency-header { background: var(--success); }
    .emergency-card.responded .emergency-header { background: var(--text2); }
    .emergency-header h3 { font-size: 15px; font-weight: 700; color: #fff; flex: 1; }
    .emergency-header .time { font-size: 12px; color: rgba(255,255,255,0.8); }
    .emergency-body { padding: 16px; }
    .shot-info { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .shot-code {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }
    .project-name { font-size: 13px; color: var(--text2); }
    .response-buttons { display: grid; gap: 10px; margin-top: 12px; }
    .response-btn {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .response-btn:active { transform: scale(0.97); }
    .response-btn.r10 { background: var(--success); color: #fff; }
    .response-btn.r30 { background: var(--warning); color: #1f1600; }
    .response-btn.rno { background: var(--danger); color: #fff; }
    .response-btn .label { flex: 1; text-align: left; }
    .confirm-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: confirmPulse 1s ease-in-out infinite;
    }
    @keyframes confirmPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .reminder-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
    }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty-state__mark {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
      color: rgba(26, 34, 51, 0.22);
    }
    .empty-state__mark svg { display: block; }
    .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 8px; font-weight: 600; }

    /* Section title */
    .section-title {
      font-size: 13px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 0 10px;
      font-weight: 600;
    }

    /* Push status */
    .push-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .push-status .dot { width: 8px; height: 8px; border-radius: 50%; }
    .push-status .dot.green { background: var(--success); }
    .push-status .dot.red { background: var(--danger); }
    .push-status .dot.yellow { background: var(--warning); }

    /* History */
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(26, 34, 51, 0.06);
    }
    .history-item .title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }
    .history-item .subtitle {
      color: var(--text2);
      font-size: 12px;
      font-weight: 500;
      margin-left: 6px;
    }
    .history-item .meta {
      font-size: 12px;
      color: var(--text2);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      line-height: 1.35;
      margin-top: 4px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.r10 { background: rgba(31, 168, 122, 0.14); border-color: rgba(31, 168, 122, 0.35); color: #0d5c45; }
    .badge.r30 { background: rgba(201, 162, 39, 0.18); border-color: rgba(201, 162, 39, 0.40); color: #5c4800; }
    .badge.rno { background: rgba(214, 61, 92, 0.12); border-color: rgba(214, 61, 92, 0.35); color: #8f1f38; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      box-shadow: 0 8px 28px rgba(26, 34, 51, 0.12);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 999;
      transition: transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Autocomplete Suggestions */
    .suggestions-container {
      position: relative;
    }
    .suggestions-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      transition: background 0.15s;
    }
    .suggestion-item:last-child {
      border-bottom: none;
    }
    .suggestion-item:hover, .suggestion-item.active {
      background: var(--surface);
    }
  </style>
</head>
<body>

  <header>
    <div class="dot"></div>
    <h1>MAGO 긴급 알림</h1>
    <div style="flex:1"></div>
    <div class="push-status">
      <div class="dot yellow" id="push-dot"></div>
      <span id="push-label">초기화 중...</span>
    </div>
  </header>

  <div class="status-bar">
    <div class="status-indicator">
      <span>👤</span>
      <span id="user-display">로그인 필요</span>
    </div>
    <div class="status-indicator">
      <span>🔔</span>
      <span id="active-count">활성 긴급 0건</span>
    </div>
  </div>

  <main>
    <!-- 설정 섹션 -->
    <div id="setup-section">
      <h2>🔐 사용자 설정</h2>
      <div class="form-group suggestions-container">
        <label>이름 (자동완성)</label>
        <input type="text" id="user-name-input" placeholder="본인 이름 입력 (예: 홍길동 COMP)" autocomplete="off" oninput="filterUsers()" onfocus="filterUsers()" />
        <div id="suggestions-list" class="suggestions-list"></div>
      </div>
      <button class="btn btn-primary btn-full" id="setup-btn" onclick="setupUser()">
        ✅ 설정 저장 및 알림 활성화
      </button>
      <div style="margin-top:10px; font-size:12px; color:var(--text2)">
        * 처음 한 번만 설정하면 이후 자동으로 알림이 수신됩니다.
      </div>
    </div>

    <!-- 활성 긴급 알림 -->
    <div id="emergency-section" style="display:none">
      <div class="section-title">활성 긴급 알림</div>
      <div id="emergency-list"></div>
      <div id="empty-state" class="empty-state" style="display:none">
        <div class="empty-state__mark" aria-hidden="true">
          <svg viewBox="0 0 72 72" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="36" cy="36" r="30" stroke="currentColor" stroke-width="1.75" />
            <path
              d="M22 37.5 L32.5 47 L50 27"
              stroke="#1fa87a"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h3>현재 긴급 상황 없음</h3>
        <p>긴급 수정 요청이 발생하면 즉시 알림이 울립니다.</p>
      </div>
    </div>

    <!-- 최근 처리 내역 -->
    <div id="history-section" style="display:none">
      <div class="section-title">최근 처리 내역</div>
      <div id="history-list"></div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const API_BASE = "";
    let currentUserId = null;
    let currentUserName = null;
    let swRegistration = null;
    let pollInterval = null;
    /** 내 할당 긴급이 pending(확인 전)일 때 15초마다 효과음 */
    let pendingUrgentAlarmId = null;
    const PENDING_ALARM_MS = 15000;
    let focusedEmergencyId = null;
    let hasUser = false;
    let sharedAudioCtx = null;
    let allUsers = [];

    // ── URL 파라미터 처리 ──────────────────────────────────────────
    function checkUrlParam() {
      const params = new URLSearchParams(window.location.search);

      const emergencyId = params.get("emergency");
      if (emergencyId) focusedEmergencyId = emergencyId;

      const urlUserId = params.get("userId");
      const urlUserName = params.get("userName");

      if (urlUserId && urlUserName) {
        currentUserId = parseInt(urlUserId);
        currentUserName = decodeURIComponent(urlUserName);
        localStorage.setItem("mago_user_id", urlUserId);
        localStorage.setItem("mago_user_name", currentUserName);
        document.getElementById("user-display").textContent = currentUserName;

        document.getElementById("setup-section").innerHTML = `
          <div style="text-align:center; padding:8px 0;">
            <div style="font-size:40px; margin-bottom:12px;">👋</div>
            <div style="font-size:18px; font-weight:700; margin-bottom:6px;">${currentUserName}님 안녕하세요!</div>
            <div style="font-size:13px; color:var(--text2); margin-bottom:20px;">
              아래 버튼을 눌러 긴급 알림을 활성화해주세요.<br>
              처음 한 번만 하면 이후 자동으로 알림을 받습니다.
            </div>
            <button class="btn btn-primary btn-full" id="setup-btn" onclick="activateFromLink()">
              🔔 알림 활성화
            </button>
          </div>`;
        return true;
      }
      return false;
    }

    // ── 저장된 사용자 불러오기 ────────────────────────────────────
    function loadSavedUser() {
      const savedId = localStorage.getItem("mago_user_id");
      const savedName = localStorage.getItem("mago_user_name");
      if (savedId && savedName) {
        currentUserId = parseInt(savedId);
        currentUserName = savedName;
        document.getElementById("user-name-input").value = savedName;
        document.getElementById("user-display").textContent = savedName;
        document.getElementById("setup-section").style.display = "none";
        document.getElementById("emergency-section").style.display = "block";
        document.getElementById("history-section").style.display = "block";
        return true;
      }
      return false;
    }

    // ── 개인 링크로 접속: 알림만 활성화 ──────────────────────────
    async function activateFromLink() {
      const btn = document.getElementById("setup-btn");
      btn.disabled = true;
      btn.textContent = "활성화 중...";
      await initPush();
      document.getElementById("setup-section").style.display = "none";
      document.getElementById("emergency-section").style.display = "block";
      document.getElementById("history-section").style.display = "block";
      showToast("✅ 완료! 이제 긴급 알림이 자동으로 수신됩니다.");
      startPolling();
    }

    // ── 자동완성 관련 함수들 ─────────────────────────────────────
    async function loadAllUsers() {
      try {
        const res = await fetch(`${API_BASE}/users`);
        const json = await res.json();
        allUsers = json.data || [];
      } catch (err) {
        console.error("Failed to load users list", err);
      }
    }

    function filterUsers() {
      const input = document.getElementById("user-name-input");
      const list = document.getElementById("suggestions-list");
      const val = input.value.trim().toLowerCase();

      if (!val) {
        list.style.display = "none";
        return;
      }

      const matched = allUsers.filter(u => u.name.toLowerCase().includes(val));

      if (matched.length === 0) {
        list.style.display = "none";
        return;
      }

      list.innerHTML = matched.map(u => `
        <div class="suggestion-item" onclick="selectUser(${u.id}, '${u.name.replace(/'/g, "\\'")}')">
          ${u.name}
        </div>
      `).join("");
      list.style.display = "block";
    }

    function selectUser(id, name) {
      currentUserId = id;
      currentUserName = name;
      document.getElementById("user-name-input").value = name;
      document.getElementById("suggestions-list").style.display = "none";
    }

    document.addEventListener("click", (e) => {
      const container = document.querySelector(".suggestions-container");
      if (container && !container.contains(e.target)) {
        const list = document.getElementById("suggestions-list");
        if (list) list.style.display = "none";
      }
    });

    // ── 수동 설정 ────────────────────────────────────────────────
    async function setupUser() {
      const userName = document.getElementById("user-name-input").value.trim();

      if (!currentUserId && userName) {
        const exactMatch = allUsers.find(u => u.name.toLowerCase() === userName.toLowerCase());
        if (exactMatch) {
          currentUserId = exactMatch.id;
          currentUserName = exactMatch.name;
        }
      }

      if (!currentUserId || !userName) {
        showToast("⚠️ 올바른 이름을 입력하고 목록에서 선택해주세요.");
        return;
      }

      localStorage.setItem("mago_user_id", currentUserId.toString());
      localStorage.setItem("mago_user_name", currentUserName);
      document.getElementById("user-display").textContent = currentUserName;

      const btn = document.getElementById("setup-btn");
      btn.disabled = true;
      btn.textContent = "설정 중...";

      await initPush();

      document.getElementById("setup-section").style.display = "none";
      document.getElementById("emergency-section").style.display = "block";
      document.getElementById("history-section").style.display = "block";
      showToast("✅ 설정 완료! 긴급 알림이 활성화되었습니다.");
      startPolling();
    }

    // ── 푸시 알림 초기화 ─────────────────────────────────────────
    async function initPush() {
      if (!("serviceWorker" in navigator)) {
        updatePushStatus("red", "푸시 미지원 브라우저");
        return;
      }
      if (!("PushManager" in window)) {
        updatePushStatus("red", "푸시 미지원");
        return;
      }

      try {
        updatePushStatus("yellow", "등록 중...");
        swRegistration = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        await navigator.serviceWorker.ready;

        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          updatePushStatus("red", "알림 권한 거부됨");
          showToast("⚠️ 알림 권한을 허용해야 긴급 알림을 받을 수 있습니다.");
          return;
        }

        const keyRes = await fetch(`${API_BASE}/vapid-public-key`);
        const { key } = await keyRes.json();

        if (!key) {
          updatePushStatus("yellow", "서버 설정 필요");
          showToast("⚠️ VAPID 키가 설정되지 않았습니다. 서버 환경변수를 확인해주세요.");
          return;
        }

        const subscription = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(key),
        });

        await fetch(`${API_BASE}/subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId, subscription }),
        });

        updatePushStatus("green", "알림 활성");

        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data?.type === "EMERGENCY_CLICK") {
            focusedEmergencyId = event.data.emergencyId;
            loadEmergencies();
            playUrgentAlarm();
          }
        });

      } catch (err) {
        console.error("Push init error:", err);
        updatePushStatus("red", "초기화 실패");
        showToast("❌ 알림 초기화 실패: " + err.message);
      }
    }

    function updatePushStatus(color, label) {
      document.getElementById("push-dot").className = `dot ${color}`;
      document.getElementById("push-label").textContent = label;
    }

    // ── 폴링 ────────────────────────────────────────────────────
    function startPolling() {
      loadEmergencies();
      pollInterval = setInterval(loadEmergencies, 10000);
    }

    async function loadEmergencies() {
      try {
        const res = await fetch(`${API_BASE}/emergency`);
        const { data } = await res.json();

        const active = data.filter(e => e.status === "pending" || e.status === "acknowledged");
        const history = data.filter(e => e.status === "responded" || e.status === "unacknowledged");

        document.getElementById("active-count").textContent = `활성 긴급 ${active.length}건`;
        renderEmergencies(active);
        renderHistory(history.slice(0, 10));

        syncPendingUrgentAlarm(active, currentUserId);

        if (focusedEmergencyId) {
          const el = document.getElementById(`card-${focusedEmergencyId}`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      } catch (err) {
        console.error("loadEmergencies error:", err);
      }
    }

    // ── 렌더링 ──────────────────────────────────────────────────
    function renderEmergencies(emergencies) {
      const list = document.getElementById("emergency-list");
      const empty = document.getElementById("empty-state");

      if (emergencies.length === 0) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      list.innerHTML = emergencies.map(createEmergencyCard).join("");
    }

    function renderHistory(history) {
      const list = document.getElementById("history-list");
      if (history.length === 0) {
        list.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:8px 0">처리 내역 없음</div>';
        return;
      }
      list.innerHTML = history.map(createHistoryItem).join("");
    }

    function createEmergencyCard(e) {
      const elapsed = formatElapsed(e.createdAt);
      const isFocused = e.id === focusedEmergencyId;
      const reminderBadge = e.reminderCount > 0
        ? `<span class="reminder-badge">${e.reminderCount}회 재전송</span>`
        : "";

      const acknowledgedHtml = e.status === "pending"
        ? `<button class="confirm-btn" onclick="acknowledge('${e.id}')">
             🔔 확인 (알림 중지)
           </button>`
        : `<div style="margin-bottom:12px;color:var(--success);font-size:13px;display:flex;align-items:center;gap:6px;">
             ✅ 확인됨 · ${formatTime(e.acknowledgedAt)}
           </div>`;

      const responseHtml = e.status === "acknowledged"
        ? `<div class="response-buttons">
             <button class="response-btn r10" onclick="respond('${e.id}','remote_within_10')">
               <span>⚡</span><span class="label">10분 이내 원격 접속 가능</span>
             </button>
             <button class="response-btn r30" onclick="respond('${e.id}','remote_within_30')">
               <span>🕐</span><span class="label">30분 이내 원격 접속 가능</span>
             </button>
             <button class="response-btn rno" onclick="respond('${e.id}','remote_unavailable')">
               <span>❌</span><span class="label">30분 이내 원격 접속 불가</span>
             </button>
           </div>`
        : "";

      return `
        <div class="emergency-card ${e.status}" id="card-${e.id}"
             style="${isFocused ? 'outline:3px solid var(--warning);' : ''}">
          <div class="emergency-header">
            <span>🚨</span>
            <h3>긴급 수정 요청 ${reminderBadge}</h3>
            <span class="time">${elapsed}</span>
          </div>
          <div class="emergency-body">
            <div class="shot-info">
              <div class="shot-code">${e.shotCode}</div>
              <div class="project-name">${e.projectName}</div>
            </div>
            ${acknowledgedHtml}
            ${responseHtml}
          </div>
        </div>`;
    }

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function createHistoryItem(e) {
      const statusMap = {
        responded:      { icon: "✅", label: "회신 완료" },
        unacknowledged: { icon: "⚠️", label: "미확인 처리" },
      };
      const responseMap = {
        remote_within_10:   { text: "10분 이내 원격 접속 가능", cls: "r10" },
        remote_within_30:   { text: "30분 이내 원격 접속 가능", cls: "r30" },
        remote_unavailable: { text: "30분 이내 원격 접속 불가", cls: "rno" },
      };
      const s = statusMap[e.status] || { icon: "•", label: e.status };
      const r = e.responseType ? (responseMap[e.responseType] || { text: e.responseType, cls: "" }) : null;
      const rBadge = r ? `<span class="badge ${r.cls}">${r.text}</span>` : "";
      const who =
        e.status === "responded" && e.respondedByName
          ? `<span class="responder-line">${escapeHtml(e.respondedByName)}${e.respondedByPart ? " " + escapeHtml(e.respondedByPart) : ""}</span>`
          : "";

      return `
        <div class="history-item">
          <span style="font-size:18px">${s.icon}</span>
          <div style="flex:1">
            <div class="title">
              ${e.shotCode}
              <span class="subtitle">${e.projectName}</span>
            </div>
            <div class="meta">
              <span>${s.label}</span>
              ${rBadge}
              ${who ? who + " " : ""}<span>· ${formatHistoryDateTime(e.respondedAt || e.createdAt)}</span>
            </div>
          </div>
        </div>`;
    }

    // ── 액션 ────────────────────────────────────────────────────
    async function acknowledge(emergencyId) {
      try {
        await fetch(`${API_BASE}/emergency/${emergencyId}/acknowledge`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId }),
        });
        showToast("✅ 확인 완료! 알림이 중지됩니다.");
        focusedEmergencyId = emergencyId;
        await loadEmergencies();
      } catch {
        showToast("❌ 오류가 발생했습니다. 다시 시도해주세요.");
      }
    }

    async function respond(emergencyId, responseType) {
      try {
        const res = await fetch(`${API_BASE}/emergency/${emergencyId}/respond`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId, responseType }),
        });
        const data = await res.json();
        showToast(`📋 응답 전달 완료: ${data.label}`);
        focusedEmergencyId = null;
        await loadEmergencies();
      } catch {
        showToast("❌ 오류가 발생했습니다. 다시 시도해주세요.");
      }
    }

    function getSharedAudioContext() {
      if (!sharedAudioCtx) {
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return sharedAudioCtx;
    }

    /**
     * 내 담당 + pending(확인 전) 긴급이 있는 동안 15초마다 반복. 확인(ack) 후 해당 건은 제외.
     */
    function syncPendingUrgentAlarm(activeList, uid) {
      const needsAlarm =
        uid != null &&
        Array.isArray(activeList) &&
        activeList.some((e) => {
          if (e.status !== "pending") return false;
          const ids = e.assigneeIds;
          if (!Array.isArray(ids)) return false;
          return ids.some((id) => Number(id) === Number(uid));
        });

      if (needsAlarm) {
        if (pendingUrgentAlarmId == null) {
          playUrgentAlarm();
          pendingUrgentAlarmId = setInterval(playUrgentAlarm, PENDING_ALARM_MS);
        }
      } else if (pendingUrgentAlarmId != null) {
        clearInterval(pendingUrgentAlarmId);
        pendingUrgentAlarmId = null;
      }
    }

    /** 더 크고 인상적인 긴급 톤(Web Audio). 기기 내장 알림음 아님. */
    async function playUrgentAlarm() {
      try {
        const ctx = getSharedAudioContext();
        if (ctx.state === "suspended") {
          await ctx.resume();
        }

        const master = ctx.createGain();
        master.gain.value = 0.42;
        master.connect(ctx.destination);

        function tone(freq, t0, dur, type, peak) {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime + t0);
          g.gain.setValueAtTime(0, ctx.currentTime + t0);
          g.gain.linearRampToValueAtTime(peak, ctx.currentTime + t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t0 + dur);
          osc.connect(g);
          g.connect(master);
          osc.start(ctx.currentTime + t0);
          osc.stop(ctx.currentTime + t0 + dur + 0.06);
        }

        let t = 0;
        for (let i = 0; i < 10; i++) {
          const hi = 1040 + (i % 2) * 180;
          const lo = 620 + (i % 2) * 90;
          tone(hi, t, 0.16, "square", 0.55);
          tone(lo, t + 0.1, 0.14, "square", 0.45);
          t += 0.2;
        }

        if (typeof navigator.vibrate === "function") {
          try {
            navigator.vibrate([280, 100, 280, 100, 450]);
          } catch (_) {
            /* ignore */
          }
        }
      } catch (e) {
        console.warn("Urgent alarm audio:", e);
      }
    }

    // ── 유틸 ────────────────────────────────────────────────────
    function showToast(msg, duration = 3500) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), duration);
    }

    function formatElapsed(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return `${diff}초 전`;
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      return `${Math.floor(diff / 3600)}시간 전`;
    }

    function formatTime(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    /** 최근 처리 내역: `20260511 오전 12:20` 형식 */
    function formatHistoryDateTime(ts) {
      if (!ts) return "-";
      const d = new Date(ts);
      const ymd =
        `${d.getFullYear()}` +
        `${String(d.getMonth() + 1).padStart(2, "0")}` +
        `${String(d.getDate()).padStart(2, "0")}`;
      const hm = d.toLocaleTimeString("ko-KR", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
      });
      return `${ymd} ${hm}`;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
    }

    // ── 초기화 ──────────────────────────────────────────────────
    loadAllUsers();
    const fromLink = checkUrlParam();
    if (!fromLink) {
      hasUser = loadSavedUser();
      if (hasUser) {
        initPush().then(() => startPolling());
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && (hasUser || currentUserId)) {
        loadEmergencies();
      }
    });

    window.addEventListener("pagehide", () => {
      if (pendingUrgentAlarmId != null) {
        clearInterval(pendingUrgentAlarmId);
        pendingUrgentAlarmId = null;
      }
    });
  </script>
</body>
